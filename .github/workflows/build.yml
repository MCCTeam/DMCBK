name: Build and unit tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - run: dotnet restore DMCBK.slnx
      - run: dotnet build DMCBK.slnx -c Release --no-restore
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - run: dotnet test DMCBK.slnx -c Release
